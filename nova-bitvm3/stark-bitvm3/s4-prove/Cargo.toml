[package]
name = "stwo-bitvm3-s4-prove"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Runs upstream's privacy recursive prover on a Cairo PIE and stores the production-config recursion proof for the S4 Boolean check"

[workspace]

[dependencies]
anyhow = "1"
hex = "0.4"
zstd = "0.13"
cairo-vm = "3.2.0"
privacy-prove = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
privacy-circuit-verify = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
privacy_common = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
cairo-program-runner-lib = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
stwo-cairo-adapter = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
stwo-cairo-prover = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-common = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-prover = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-serialize = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuits = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
stwo = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02", features = ["parallel"] }
starknet-types-core = { version = "=0.2.4", features = ["hash", "prime-bigint", "serde", "curve", "num-traits"] }
tempfile = "3.10.1"
serde_json = "1"
cairo-air = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-verifier = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
stwo_cairo_common = { package = "stwo-cairo-common", git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }

[profile.release]
opt-level = 3
debug = 0
