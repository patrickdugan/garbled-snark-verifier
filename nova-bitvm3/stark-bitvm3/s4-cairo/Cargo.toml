[package]
name = "stwo-bitvm3-s4-cairo"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
description = "Boolean lowering of the pinned Stwo circuit verifiers: sizes, real-proof checks, Shinigami receipts, optional full-size garbling"

[workspace]

[features]
# S5: full-size garbling on the repository's half-gates engine (off by default; adds the parent crate).
garbled = ["dep:garbled-snark-verifier", "dep:stwo-bitvm3-adapter", "dep:rand", "dep:rand_chacha", "dep:blake3"]

[dependencies]
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
stwo-bitvm3-core = { path = "../core" }
stwo-bitvm3-lowering = { path = "../lowering" }
stwo-bitvm3-upstream = { path = "../upstream" }
privacy-circuit-verify = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-cairo-verifier = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuits = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-verifier = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuits-stark-verifier = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
stwo = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02", default-features = false, features = ["std"] }
num-traits = "0.2"
circuit-serialize = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-prover = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02", features = ["test-utils"] }
serde_json = "1"
privacy_common = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
cairo-air = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
circuit-common = { git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
stwo_cairo_common = { package = "stwo-cairo-common", git = "https://github.com/starkware-libs/proving", rev = "e9a38e12d09979f7a8625e233a80fecac6c38f02" }
starknet-types-core = { version = "=0.2.4", features = ["hash", "prime-bigint", "serde", "curve", "num-traits"] }
garbled-snark-verifier = { path = "../../..", default-features = false, optional = true }
stwo-bitvm3-adapter = { path = "../adapter", optional = true }
rand = { version = "0.8", optional = true }
rand_chacha = { version = "0.3", optional = true }
blake3 = { version = "1.6.1", optional = true }

[dev-dependencies]
stwo-bitvm3-lowering = { path = "../lowering", features = ["test-utils"] }

[profile.dev]
opt-level = 2
debug = 0
incremental = false

[profile.release]
debug = 0
