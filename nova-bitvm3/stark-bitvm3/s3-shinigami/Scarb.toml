[package]
name = "shinigami_bitvm3_receipt"
version = "0.1.0"
edition = "2024_07"

[workspace]

[executable]
# The upstream engine contains signature syscall branches. The wrapper rejects
# every locking script outside the fixed CSV and SHA256 profiles before calling
# that engine. These fixtures must execute with zero syscalls. Signature proving
# is unsupported; this compiler option does not authenticate syscall results.
allow-syscalls = true

[cairo]
enable-gas = false

[dependencies]
cairo_execute = "=2.18.0"
shinigami_engine = { path = "vendor/shinigami/packages/engine" }
shinigami_utils = { path = "vendor/shinigami/packages/utils" }

[dev-dependencies]
cairo_test = "=2.18.0"

[scripts]
test = "scarb cairo-test"
