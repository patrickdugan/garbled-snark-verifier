name: Stwo BitVM3 component checks
on:
  push:
    branches: ['main', 'feat/stwo-bitvm3-*']
    paths: ['nova-bitvm3/stark-bitvm3/**', '.github/workflows/stwo-bitvm3.yml']
  pull_request:
    paths: ['nova-bitvm3/stark-bitvm3/**', '.github/workflows/stwo-bitvm3.yml']
  workflow_dispatch:
    inputs:
      s2_fixture:
        description: 'Explicitly verify and garble the frozen test-only STARK fixture'
        type: boolean
        default: false
      s3_execute:
        description: 'Compile and execute the pinned Shinigami receipt laboratory'
        type: boolean
        default: false
      s3_native_proof:
        description: 'Permit one 120-second native Cairo proof attempt'
        type: boolean
        default: false
      s3_rss_probe:
        description: 'Try the frozen Cairo trace once with observed RSS guard'
        type: boolean
        default: false
      s3_standalone_probe:
        description: 'Try one smaller standalone Cairo execution under RSS guard'
        type: boolean
        default: false
      s3_small_profile:
        description: 'Try one native Cairo STARK with the pinned small preprocessing profile'
        type: boolean
        default: false
      s3_lookup_diag:
        description: 'Diagnose one pinned Cairo lookup residual; native proof remains rejected'
        type: boolean
        default: false
      s3_no_pedersen_profile:
        description: 'One bounded native Cairo proof with full sequence range, no Pedersen table'
        type: boolean
        default: false
      s3_relation_audit:
        description: 'One bounded relation-tuple diagnostic on frozen canonical_small execution'
        type: boolean
        default: false
      s3_local_relation_audit:
        description: 'One bounded 2048-row range-check component diagnostic, no proof acceptance'
        type: boolean
        default: false
      s3_xor8_relation_audit:
        description: 'One bounded verify_bitwise_xor_8 source-claim audit, no proof acceptance'
        type: boolean
        default: false
      s3_xor8_counterparties:
        description: 'One bounded XOR8 source zero-input callsite audit; no proof acceptance'
        type: boolean
        default: false
      s3_xor8_caller_air:
        description: 'One bounded bitwise_builtin caller-AIR XOR8 cancellation audit; no proof acceptance'
        type: boolean
        default: false
      s3_memory_ledger:
        description: 'One bounded per-family lookup balance across all components; no proof acceptance'
        type: boolean
        default: false
      s3_corrected_context:
        description: 'One native proof of the frozen trace with its public segment context corrected'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: stwo-bitvm3-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Deterministic references and bounded Boolean checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nova-bitvm3/stark-bitvm3/ci
          python3 nova-bitvm3/stark-bitvm3/reference_vectors.py
          python3 nova-bitvm3/stark-bitvm3/reference_vectors.py --check
          timeout 120s cargo +1.90.0 test --locked --manifest-path nova-bitvm3/stark-bitvm3/core/Cargo.toml -- --nocapture --test-threads=2 2>&1 | tee nova-bitvm3/stark-bitvm3/ci/components.txt
          timeout 120s cargo +1.90.0 test --locked --manifest-path nova-bitvm3/stark-bitvm3/lowering/Cargo.toml --features test-utils -- --nocapture --test-threads=2 2>&1 | tee nova-bitvm3/stark-bitvm3/ci/lowering.txt
          timeout 20s python3 -m unittest discover -s nova-bitvm3/stark-bitvm3/s3-shinigami/tools -p 'test_*.py' -v 2>&1 | tee nova-bitvm3/stark-bitvm3/ci/rss-guard-tests.txt
          python3 nova-bitvm3/stark-bitvm3/s3-shinigami/tools/check_low_memory_profile.py | tee nova-bitvm3/stark-bitvm3/ci/small-profile-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stwo-components-${{ github.sha }}
          path: nova-bitvm3/stark-bitvm3/ci/
  tiny-garbling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-bitvm3/stark-bitvm3/adapter
      - name: Verify dependency boundary and garble bounded components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nova-bitvm3/stark-bitvm3/ci
          cargo +1.90.0 tree --manifest-path nova-bitvm3/stark-bitvm3/adapter/Cargo.toml -e normal,build > nova-bitvm3/stark-bitvm3/ci/dependencies.txt
          if grep -Ei 'sp1-(prover|sdk|build)|cuda' nova-bitvm3/stark-bitvm3/ci/dependencies.txt; then
            echo 'Unexpected prover dependency'; exit 1
          fi
          timeout 420s cargo +1.90.0 test --manifest-path nova-bitvm3/stark-bitvm3/adapter/Cargo.toml --tests -- --nocapture --test-threads=1 2>&1 | tee nova-bitvm3/stark-bitvm3/ci/garbled.txt
          cp nova-bitvm3/stark-bitvm3/adapter/Cargo.lock nova-bitvm3/stark-bitvm3/ci/adapter-Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stwo-garbling-${{ github.sha }}
          path: nova-bitvm3/stark-bitvm3/ci/
  upstream-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-bitvm3/stark-bitvm3/upstream
          cache-on-failure: true
      - name: Compile pinned native circuit checker and compare its gate semantics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nova-bitvm3/stark-bitvm3/ci
          timeout 120s cargo +1.94.0 tree --manifest-path nova-bitvm3/stark-bitvm3/upstream/Cargo.toml -e features > nova-bitvm3/stark-bitvm3/ci/upstream-dependencies.txt
          if grep -E 'sp1-(prover|sdk|build)|stwo feature "prover"|stwo-cairo-prover|circuits-stark-verifier-examples' nova-bitvm3/stark-bitvm3/ci/upstream-dependencies.txt; then
            echo 'Prover code is outside this bounded job'; exit 1
          fi
          timeout 420s cargo +1.94.0 test --manifest-path nova-bitvm3/stark-bitvm3/upstream/Cargo.toml --test conformance -- --nocapture --test-threads=1 2>&1 | tee nova-bitvm3/stark-bitvm3/ci/upstream.txt
          cp nova-bitvm3/stark-bitvm3/upstream/Cargo.lock nova-bitvm3/stark-bitvm3/ci/upstream-Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stwo-upstream-${{ github.sha }}
          path: nova-bitvm3/stark-bitvm3/ci/
  s2-fixture:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.s2_fixture) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[s2-fixture]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RAYON_NUM_THREADS: '2'
      RUSTFLAGS: '-C debuginfo=0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-06
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-bitvm3/stark-bitvm3/s2-lab
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42632483370
          name: stwo-s2-fixture-2e107d2f4423887e80c834e4a2a0f22a34640b2c
          path: nova-bitvm3/stark-bitvm3/s2-lab/out/
      - name: Compile isolated verifier and disk-backed garbling test
        shell: bash
        run: |
          set -euo pipefail
          OUT=nova-bitvm3/stark-bitvm3/s2-lab/out
          timeout --kill-after=5s 360s cargo +nightly-2026-03-06 build --features garbled --manifest-path nova-bitvm3/stark-bitvm3/s2-lab/Cargo.toml 2>&1 | tee "$OUT/build.txt"
          timeout --kill-after=5s 60s cargo +nightly-2026-03-06 test --features garbled --manifest-path nova-bitvm3/stark-bitvm3/s2-lab/Cargo.toml --bin s2-garble -- --nocapture 2>&1 | tee "$OUT/backend-test.txt"
          cp nova-bitvm3/stark-bitvm3/s2-lab/Cargo.lock "$OUT/Cargo.lock"
      - name: Recheck frozen proof and full garbled acceptance labels
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 6291456
          OUT=nova-bitvm3/stark-bitvm3/s2-lab/out
          BIN=nova-bitvm3/stark-bitvm3/s2-lab/target/debug
          /usr/bin/time -v timeout --kill-after=5s 180s "$BIN/stwo-bitvm3-s2-lab" check "$OUT" 735bf38f3d45a8ef537279d8f4e244b11afee2863ac91ebcab5d079195365210 2>&1 | tee "$OUT/check.txt"
          /usr/bin/time -v timeout --kill-after=5s 180s "$BIN/s2-garble" "$OUT" 2>&1 | tee "$OUT/garbling.txt"
      - name: Remove bounded ciphertext scratch
        if: always()
        run: rm -f nova-bitvm3/stark-bitvm3/s2-lab/s2-ciphertexts.bin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stwo-s2-fixture-${{ github.sha }}
          path: nova-bitvm3/stark-bitvm3/s2-lab/out/
  s3-shinigami:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.s3_execute || inputs.s3_native_proof)) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[s3-execute]') || contains(github.event.head_commit.message, '[s3-prove]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: starkware-bitcoin/shinigami
          ref: 7e8c05d60b4bd7ae91ddc18a42e8e13090286f0c
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/shinigami
      - uses: actions/checkout@v4
        with:
          repository: j1mbo64/ripemd160_cairo
          ref: cdc5ab58b0acc64db87e0b03851fb18213977dc8
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/ripemd160
      - uses: actions/checkout@v4
        with:
          repository: j1mbo64/sha1_cairo
          ref: 280b4c64ae457fdc4bd7cd807efd17e8dced654e
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/sha1
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0
          cache: false
      - name: Build and exercise the actual pinned engine
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 6291456
          python3 tools/prepare.py
          python3 tools/cases.py out
          scarb --version | tee out/toolchain.txt
          cp src/tests.cairo out/generated-tests.cairo
          cp src/hash_tests.cairo out/generated-hash-tests.cairo
          /usr/bin/time -v timeout --kill-after=5s 180s scarb build 2>&1 | tee out/build.txt
          cp Scarb.lock out/Scarb.lock
          /usr/bin/time -v timeout --kill-after=5s 180s scarb test 2>&1 | tee out/tests.txt
          /usr/bin/time -v timeout --kill-after=5s 60s scarb execute --no-build --arguments-file out/csv_valid.args.json --print-program-output --print-resource-usage 2>&1 | tee out/execution.txt
          python3 tools/audit_execution.py out/execution.txt
          cp target/dev/*.executable.json out/
          find target/execute -type f -printf '%P %s bytes\n' | tee out/execution-files.txt
      - name: Explicit bounded native Cairo proof probe
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.s3_native_proof) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-prove]'))
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        run: python3 tools/prove_once.py --prove
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinigami-s3-${{ github.sha }}
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/out/

  s3-rss-probe:
    # Changed hypothesis: the old 6 GiB RLIMIT_AS rejected a virtual-memory
    # reservation. Reuse exact saved bytes with sampled 4 GiB RSS, once only.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.s3_rss_probe) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-rss-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: starkware-bitcoin/shinigami
          ref: 7e8c05d60b4bd7ae91ddc18a42e8e13090286f0c
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/shinigami
      - uses: actions/checkout@v4
        with:
          repository: j1mbo64/ripemd160_cairo
          ref: cdc5ab58b0acc64db87e0b03851fb18213977dc8
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/ripemd160
      - uses: actions/checkout@v4
        with:
          repository: j1mbo64/sha1_cairo
          ref: 280b4c64ae457fdc4bd7cd807efd17e8dced654e
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/sha1
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0
          cache: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42642735526
          name: shinigami-s3-c8894f4ee6023ca1d0544b6c8c62571c426f1072
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/out/frozen/
      - name: Rebuild pinned executable without proof generation
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare.py
          python3 tools/cases.py out
          scarb --version | tee out/rss-toolchain.txt
          timeout --kill-after=5s 180s scarb build 2>&1 | tee out/rss-build.txt
      - name: Single saved-input proving probe, 4 GiB RSS and 120 s
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          # No ulimit -v. The watchdog checks resident pages for the process
          # group and records virtual size separately, with an explicit timeout.
          python3 tools/prove_saved.py --prove-saved --source out/frozen --rss-mib 4096 --timeout-seconds 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinigami-s3-rss-${{ github.sha }}
          path: |
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/rss-*.txt
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/rss-proof-report.json
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/native-proof.json
          if-no-files-found: warn

  s3-standalone-probe:
    # The bootloader trace crossed 4 GiB RSS. Try a 157k-step standalone
    # execution instead of repeating the 2.77m-step bootloader workload.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.s3_standalone_probe) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-standalone-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: starkware-bitcoin/shinigami
          ref: 7e8c05d60b4bd7ae91ddc18a42e8e13090286f0c
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/shinigami
      - uses: actions/checkout@v4
        with:
          repository: j1mbo64/ripemd160_cairo
          ref: cdc5ab58b0acc64db87e0b03851fb18213977dc8
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/ripemd160
      - uses: actions/checkout@v4
        with:
          repository: j1mbo64/sha1_cairo
          ref: 280b4c64ae457fdc4bd7cd807efd17e8dced654e
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/sha1
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: 2.18.0
          cache: false
      - name: Pin sources, prepare CSV fixture and compile
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare.py
          python3 tools/cases.py out
          scarb --version | tee out/standalone-toolchain.txt
          timeout --kill-after=5s 180s scarb build 2>&1 | tee out/standalone-build.txt
      - name: Prove a single standalone CSV execution under RSS guard
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prove_standalone.py --prove-once --rss-mib 4096 --timeout-seconds 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinigami-s3-standalone-${{ github.sha }}
          path: |
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/standalone-*.txt
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/standalone-*.json
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/standalone-*.gz
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/source-pins.json
          if-no-files-found: warn

  s3-small-profile:
    # Reduced preprocessed table (10.2m vs 543m cells) and smaller FFT lifting.
    # Only one explicit proof is allowed; routine CI stays proof-free.
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.s3_small_profile || inputs.s3_lookup_diag || inputs.s3_no_pedersen_profile || inputs.s3_relation_audit || inputs.s3_local_relation_audit || inputs.s3_xor8_relation_audit || inputs.s3_xor8_counterparties || inputs.s3_xor8_caller_air || inputs.s3_memory_ledger || inputs.s3_corrected_context)) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[s3-small-profile]') || contains(github.event.head_commit.message, '[s3-lookup]') || contains(github.event.head_commit.message, '[s3-no-pedersen]') || contains(github.event.head_commit.message, '[s3-relations]') || contains(github.event.head_commit.message, '[s3-local]') || contains(github.event.head_commit.message, '[s3-xor8]') || contains(github.event.head_commit.message, '[s3-counterparties]') || contains(github.event.head_commit.message, '[s3-caller]') || contains(github.event.head_commit.message, '[s3-ledger]') || contains(github.event.head_commit.message, '[s3-context]')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAYON_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
      RUST_MIN_STACK: '16777216'
      S3_LOOKUP_DIAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_lookup_diag) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-lookup]')) }}
      S3_NO_PEDERSEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_no_pedersen_profile) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-no-pedersen]')) }}
      S3_RELATION_AUDIT: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_relation_audit) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-relations]')) }}
      S3_LOCAL_RELATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_local_relation_audit) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-local]')) }}
      S3_XOR8_RELATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_xor8_relation_audit) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-xor8]')) }}
      S3_XOR8_COUNTERPARTIES: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_xor8_counterparties) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-counterparties]')) }}
      S3_XOR8_CALLER_AIR: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_xor8_caller_air) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-caller]')) }}
      S3_MEMORY_LEDGER: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_memory_ledger) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-ledger]')) }}
      S3_CORRECTED_CONTEXT: ${{ (github.event_name == 'workflow_dispatch' && inputs.s3_corrected_context) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[s3-context]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: starkware-libs/stwo-cairo
          ref: 467d5c6d4d6d526c1db8ff69c14f2de6d57f4d73
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/stwo-cairo
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-06-23
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nova-bitvm3/stark-bitvm3/s3-shinigami/vendor/stwo-cairo/stwo_cairo_prover
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42721464987
          name: shinigami-s3-standalone-6dedfcdf8277dd75add96998277fac11a417fc92
          path: nova-bitvm3/stark-bitvm3/s3-shinigami/out/frozen/
      - name: Pin low-memory profile and compile matched native Rust prover
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          if [[ ( "$S3_RELATION_AUDIT" == "true" && ( "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" || "$S3_LOCAL_RELATION" == "true" || "$S3_XOR8_RELATION" == "true" ) ) || ( "$S3_LOCAL_RELATION" == "true" && ( "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" || "$S3_XOR8_RELATION" == "true" ) ) || ( "$S3_XOR8_RELATION" == "true" && ( "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" ) ) ]]; then
            echo "Select exactly one source-level diagnostic"; exit 1
          fi
          if [[ "$S3_XOR8_COUNTERPARTIES" == "true" && ( "$S3_RELATION_AUDIT" == "true" || "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" || "$S3_LOCAL_RELATION" == "true" || "$S3_XOR8_RELATION" == "true" ) ]]; then
            echo "Select only one source-level diagnostic"; exit 1
          fi
          if [[ "$S3_XOR8_CALLER_AIR" == "true" && ( "$S3_RELATION_AUDIT" == "true" || "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" || "$S3_LOCAL_RELATION" == "true" || "$S3_XOR8_RELATION" == "true" || "$S3_XOR8_COUNTERPARTIES" == "true" ) ]]; then
            echo "Select only one source-level diagnostic"; exit 1
          fi
          if [[ "$S3_MEMORY_LEDGER" == "true" && ( "$S3_RELATION_AUDIT" == "true" || "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" || "$S3_LOCAL_RELATION" == "true" || "$S3_XOR8_RELATION" == "true" || "$S3_XOR8_COUNTERPARTIES" == "true" || "$S3_XOR8_CALLER_AIR" == "true" ) ]]; then
            echo "Select only one source-level diagnostic"; exit 1
          fi
          if [[ "$S3_CORRECTED_CONTEXT" == "true" && ( "$S3_RELATION_AUDIT" == "true" || "$S3_NO_PEDERSEN" == "true" || "$S3_LOOKUP_DIAG" == "true" || "$S3_LOCAL_RELATION" == "true" || "$S3_XOR8_RELATION" == "true" || "$S3_XOR8_COUNTERPARTIES" == "true" || "$S3_XOR8_CALLER_AIR" == "true" || "$S3_MEMORY_LEDGER" == "true" ) ]]; then
            echo "Select only one source-level diagnostic"; exit 1
          fi
          if [[ "$S3_NO_PEDERSEN" == "true" ]]; then
            python3 tools/check_no_pedersen_profile.py --input out/frozen/standalone-prover-input.json.gz --upstream vendor/stwo-cairo | tee out/no-pedersen-preflight.json
          else
            python3 tools/check_low_memory_profile.py --upstream vendor/stwo-cairo | tee out/small-profile-preflight.json
          fi
          if [[ "$S3_LOOKUP_DIAG" == "true" ]]; then
            python3 tools/instrument_lookup.py --upstream vendor/stwo-cairo --output out/small-profile-lookup.patch | tee out/small-profile-instrument.json
          fi
          feature_args=()
          if [[ "$S3_RELATION_AUDIT" == "true" ]]; then
            python3 tools/instrument_relations.py --upstream vendor/stwo-cairo --output out/small-profile-relations.patch | tee out/small-profile-relations-instrument.json
            feature_args=(--features stwo-cairo-prover/relation-tracker)
          fi
          if [[ "$S3_LOCAL_RELATION" == "true" ]]; then
            python3 tools/instrument_local_relations.py --upstream vendor/stwo-cairo --output out/small-profile-local.patch | tee out/small-profile-local-instrument.json
            feature_args=(--features stwo-cairo-prover/relation-tracker)
          fi
          if [[ "$S3_XOR8_RELATION" == "true" ]]; then
            python3 tools/instrument_xor8_relations.py --upstream vendor/stwo-cairo --output out/small-profile-xor8.patch | tee out/small-profile-xor8-instrument.json
            feature_args=(--features stwo-cairo-prover/relation-tracker)
          fi
          if [[ "$S3_XOR8_COUNTERPARTIES" == "true" ]]; then
            python3 tools/instrument_xor8_counterparties.py --upstream vendor/stwo-cairo --output out/small-profile-counterparties.patch | tee out/small-profile-counterparties-instrument.json
            feature_args=(--features stwo-cairo-prover/relation-tracker)
          fi
          if [[ "$S3_XOR8_CALLER_AIR" == "true" ]]; then
            python3 tools/instrument_xor8_caller_air.py --upstream vendor/stwo-cairo --output out/small-profile-caller.patch | tee out/small-profile-caller-instrument.json
            feature_args=(--features stwo-cairo-prover/relation-tracker)
          fi
          if [[ "$S3_MEMORY_LEDGER" == "true" ]]; then
            python3 tools/instrument_memory_ledger.py --upstream vendor/stwo-cairo --output out/small-profile-ledger.patch | tee out/small-profile-ledger-instrument.json
            feature_args=(--features stwo-cairo-prover/relation-tracker)
          fi
          timeout --kill-after=5s 600s cargo +nightly-2025-06-23 build --locked \
            --profile witness-opt-1 \
            --manifest-path vendor/stwo-cairo/stwo_cairo_prover/Cargo.toml \
            -p stwo-cairo-dev-utils --bin prove "${feature_args[@]}" 2>&1 | tee out/small-profile-build.txt
      - name: One native STARK using pinned profile and 4 GiB sampled RSS
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$S3_NO_PEDERSEN" == "true" ]]; then
            python3 tools/prove_no_pedersen.py --prove-no-pedersen-once --rss-mib 4096 --timeout-seconds 120
          elif [[ "$S3_CORRECTED_CONTEXT" == "true" ]]; then
            python3 tools/prove_corrected_context.py --prove-corrected-once --rss-mib 4096 --timeout-seconds 120
          elif [[ "$S3_MEMORY_LEDGER" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Unexpected native proof acceptance during ledger audit"; exit 1
            fi
            python3 tools/summarize_memory_ledger.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-ledger-summary.json
          elif [[ "$S3_XOR8_CALLER_AIR" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Unexpected native proof acceptance during caller-AIR audit"; exit 1
            fi
            python3 tools/summarize_xor8_caller_air.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-caller-summary.json
          elif [[ "$S3_XOR8_COUNTERPARTIES" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Unexpected native proof acceptance during attribution audit"; exit 1
            fi
            python3 tools/summarize_xor8_counterparties.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-counterparties-summary.json
          elif [[ "$S3_XOR8_RELATION" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Unexpected native proof acceptance during XOR8 diagnostic"; exit 1
            fi
            python3 tools/summarize_xor8_relations.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-xor8-summary.json
          elif [[ "$S3_LOCAL_RELATION" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Unexpected proof success during partial diagnostic; manual verification required"; exit 1
            fi
            python3 tools/summarize_local_relations.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-local-summary.json
          elif [[ "$S3_RELATION_AUDIT" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Unexpected proof success during diagnostic; require manual verification"; exit 1
            fi
            python3 tools/summarize_relations.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-relations-summary.json
          elif [[ "$S3_LOOKUP_DIAG" == "true" ]]; then
            set +e
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              echo "Native proof unexpectedly succeeded during diagnostic: manual review required"; exit 1
            fi
            python3 tools/summarize_lookup.py --log out/small-profile-proving.txt --report out/small-profile-report.json --output out/small-profile-lookup-summary.json
          else
            python3 tools/prove_low_memory.py --prove-small-once --rss-mib 4096 --timeout-seconds 120
          fi
      - name: Publish compact caller-AIR evidence as annotations
        if: always() && env.S3_XOR8_CALLER_AIR == 'true'
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: python3 tools/annotate_caller_summary.py --summary out/small-profile-caller-summary.json --log out/small-profile-proving.txt --instrument out/small-profile-caller-instrument.json --report out/small-profile-report.json
      - name: Publish compact corrected-context evidence as annotations
        if: always() && env.S3_CORRECTED_CONTEXT == 'true'
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: python3 tools/annotate_caller_summary.py --kind context --summary /dev/null --log /dev/null --instrument /dev/null --report out/small-profile-context-report.json
      - name: Publish compact ledger evidence as annotations
        if: always() && env.S3_MEMORY_LEDGER == 'true'
        working-directory: nova-bitvm3/stark-bitvm3/s3-shinigami
        shell: bash
        run: python3 tools/annotate_caller_summary.py --kind ledger --summary out/small-profile-ledger-summary.json --log out/small-profile-proving.txt --instrument out/small-profile-ledger-instrument.json --report out/small-profile-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinigami-s3-small-${{ github.sha }}
          path: |
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/small-profile-*.txt
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/small-profile-*.json
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/small-profile-*.patch
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/no-pedersen-*.txt
            nova-bitvm3/stark-bitvm3/s3-shinigami/out/no-pedersen-*.json
          if-no-files-found: warn
